<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Electron Orbit</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        background: #030303;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    canvas {
        width: 700px;
        height: 700px;
        max-width: 95vw;
        max-height: 95vh;
    }
</style>
</head>

<body>

<canvas id="atom"></canvas>

<script>

const canvas = document.getElementById("atom");
const ctx = canvas.getContext("2d");

let W, H;
let centerX, centerY;


/* ============================
   CANVAS
============================ */

function resize() {

    const dpr = window.devicePixelRatio || 1;

    W = canvas.clientWidth;
    H = canvas.clientHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    ctx.setTransform(
        dpr, 0,
        0, dpr,
        0, 0
    );

    centerX = W / 2;
    centerY = H / 2;
}

resize();

window.addEventListener("resize", resize);


/* ============================
   ORBIT SETTINGS
============================ */

const radiusX = 250;
const radiusY = 85;


/*
    Electron position around
    current orbit
*/

let electronAngle = 0;


/*
    Rotation of the entire
    orbital system
*/

let orbitRotation = 0;


/*
    Speed
*/

let electronSpeed = 0.012;
let rotationSpeed = 0.0025;


/*
    How many completed orbits
    we have drawn
*/

let completedOrbits = 0;


/*
    Store previous orbit paths.

    Each completed orbit gets
    a slightly different rotation.
*/

let orbitPaths = [];


/* ============================
   DRAW CURRENT ORBIT
============================ */

function getPoint(angle, rotation) {

    const x =
        radiusX * Math.cos(angle);

    const y =
        radiusY * Math.sin(angle);


    const rotatedX =
        x * Math.cos(rotation) -
        y * Math.sin(rotation);

    const rotatedY =
        x * Math.sin(rotation) +
        y * Math.cos(rotation);


    return {
        x: centerX + rotatedX,
        y: centerY + rotatedY
    };
}


/* ============================
   DRAW SAVED ORBITS
============================ */

function drawPreviousOrbits() {

    orbitPaths.forEach(path => {

        ctx.beginPath();

        path.forEach((point, index) => {

            if (index === 0) {
                ctx.moveTo(
                    point.x,
                    point.y
                );
            } else {
                ctx.lineTo(
                    point.x,
                    point.y
                );
            }

        });

        ctx.strokeStyle =
            "rgba(255,255,255,0.28)";

        ctx.lineWidth = 1.5;

        ctx.stroke();

    });

}


/* ============================
   DRAW CURRENT ORBIT
============================ */

function drawCurrentOrbit() {

    ctx.beginPath();

    const steps = 250;

    for (let i = 0; i <= steps; i++) {

        const progress =
            i / steps;

        const angle =
            electronAngle * progress;

        const point =
            getPoint(
                angle,
                orbitRotation
            );

        if (i === 0) {

            ctx.moveTo(
                point.x,
                point.y
            );

        } else {

            ctx.lineTo(
                point.x,
                point.y
            );
        }
    }

    ctx.strokeStyle =
        "rgba(255,255,255,0.9)";

    ctx.lineWidth = 2;

    ctx.shadowBlur = 8;
    ctx.shadowColor = "white";

    ctx.stroke();

    ctx.shadowBlur = 0;
}


/* ============================
   ELECTRON
============================ */

function drawElectron() {

    const point =
        getPoint(
            electronAngle,
            orbitRotation
        );


    ctx.beginPath();

    ctx.arc(
        point.x,
        point.y,
        8,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "white";

    ctx.shadowBlur = 25;
    ctx.shadowColor = "white";

    ctx.fill();

    ctx.shadowBlur = 0;
}


/* ============================
   NUCLEUS
============================ */

function drawNucleus() {

    const gradient =
        ctx.createRadialGradient(
            centerX,
            centerY,
            0,
            centerX,
            centerY,
            45
        );

    gradient.addColorStop(
        0,
        "white"
    );

    gradient.addColorStop(
        0.25,
        "rgba(255,255,255,.65)"
    );

    gradient.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        45,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = gradient;

    ctx.fill();
}


/* ============================
   SAVE COMPLETED ORBIT
============================ */

function saveOrbit() {

    const path = [];

    const steps = 400;

    /*
        Give every new orbit a
        different orientation.

        This creates the atom-like
        overlapping pattern.
    */

    const orbitAngle =
        orbitRotation;


    for (let i = 0; i <= steps; i++) {

        const angle =
            (Math.PI * 2) *
            (i / steps);

        path.push(
            getPoint(
                angle,
                orbitAngle
            )
        );

    }

    orbitPaths.push(path);


    /*
        Prevent unlimited memory use.

        Keep the last 40 orbits.
    */

    if (orbitPaths.length > 40) {

        orbitPaths.shift();

    }

}


/* ============================
   ANIMATION
============================ */

function animate() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
        Previously completed orbits
    */

    drawPreviousOrbits();


    /*
        Current orbit being drawn
    */

    drawCurrentOrbit();


    /*
        Electron
    */

    drawElectron();


    /*
        Nucleus
    */

    drawNucleus();


    /* ========================
       UPDATE
    ======================== */

    electronAngle += electronSpeed;

    orbitRotation += rotationSpeed;


    /*
        Electron completed
        one complete revolution.
    */

    if (electronAngle >= Math.PI * 2) {

        electronAngle -= Math.PI * 2;

        saveOrbit();

        completedOrbits++;

    }


    requestAnimationFrame(animate);
}


animate();

</script>

</body>
</html>
